<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCADA I&amp;C Field Toolkit</title>
<meta name="description" content="Offline-capable SCADA/I&amp;C toolkit for Oil &amp; Gas projects (ISA-101, API 2350, IEC 61511).">
<meta name="theme-color" content="#0c1015">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCADA I&C">
<meta name="application-name" content="SCADA I&C">
<meta name="msapplication-TileColor" content="#0c1015">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="top">
  <h1>SCADA I&amp;C <span>Field Toolkit</span></h1>
  <div id="alarm-banner" class="banner s-off" role="alert" aria-live="assertive" aria-atomic="true">○ No active alarms</div>
  <div class="hdr-r">
    <span id="alarm-count" class="tag s-off" role="status" aria-label="Unacknowledged alarms">○ UNACK 0</span>
    <span id="net" class="tag s-ok" role="status">● ONLINE</span>
    <time id="clock"></time>
    <button id="install" class="btn" hidden>⬇ Install</button>
  </div>
</header>
<nav id="nav" aria-label="Primary">
  <a href="#home"><i aria-hidden="true">◫</i><span>Mimic</span></a>
  <a href="#tank"><i aria-hidden="true">▮</i><span>Tanks</span></a>
  <a href="#esd"><i aria-hidden="true">⛔</i><span>ESD</span></a>
  <a href="#lpg"><i aria-hidden="true">⚙</i><span>LPG</span></a>
  <a href="#pipe"><i aria-hidden="true">≈</i><span>Pipe</span></a>
  <a href="#cdu"><i aria-hidden="true">⫴</i><span>CDU</span></a>
  <a href="#loop"><i aria-hidden="true">⎍</i><span>Loop</span></a>
</nav>
<main id="main" tabindex="-1">
  <section id="v-home" hidden>
    <h2>Process Topology &amp; Mimic</h2>
    <div class="card"><svg id="mimic" viewBox="0 0 800 170" role="img" aria-label="Process flow: tank, inlet valve, pumps, pipeline valve, pipeline, CDU-01"></svg></div>
    <div class="card"><h3>Alarm Summary <small>(ISA-18.2 style)</small></h3><ul id="alarm-list" class="alist"></ul></div>
  </section>
  <section id="v-tank" hidden></section>
  <section id="v-esd" hidden></section>
  <section id="v-lpg" hidden></section>
  <section id="v-pipe" hidden></section>
  <section id="v-cdu" hidden></section>
  <section id="v-loop" hidden></section>
</main>
<dialog id="dlg" aria-labelledby="dlg-text">
  <form method="dialog"><p id="dlg-text"></p>
    <div class="row"><button class="btn" value="cancel">Cancel</button><button class="btn pri" value="ok">Confirm</button></div></form>
</dialog>
<noscript><p style="padding:1rem">JavaScript is required.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
