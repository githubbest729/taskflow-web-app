<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1015"><title>Offline – SCADA I&amp;C</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1015;color:#e5edf4;font:16px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:420px;padding:1.5rem;text-align:center;background:#161f28;border:1px solid #2a3846;border-radius:10px;margin:1rem}
h1{font-size:1.3rem}.t{color:#f59e0b;font-weight:700}p{color:#94a3b8}
button{min-height:48px;min-width:48px;padding:0 1.4rem;border-radius:8px;border:1px solid #06b6d4;background:#06b6d4;color:#00222a;font-weight:700;font-size:1rem;cursor:pointer}
button:hover{filter:brightness(1.1)}button:focus-visible{outline:3px solid #fff;outline-offset:2px}button:active{transform:scale(.97)}
</style></head><body><main>
<p class="t">◆ OFFLINE</p><h1>No network connection</h1>
<p>This page is not cached. Previously opened modules and locally saved loop-check punchlists remain available.</p>
<p id="s" role="status">Probing connection…</p>
<button id="r">Retry connection</button><p><a href="./index.html" style="color:#06b6d4">Open cached app</a></p>
</main><script>
const s=document.getElementById('s');
async function probe(){s.textContent='Probing connection…';
 try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});if(r.ok){s.textContent='● Online – reloading';location.href='./index.html';return}}catch(e){}
 s.textContent='○ Still offline. Cached data is available in the app.'}
document.getElementById('r').onclick=probe;addEventListener('online',probe);probe();
</script></body></html>
